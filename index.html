<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Lyam Mafray-Lizé - Développeur Fullstack & IA</title>
<meta name="description" content="Lyam Mafray-Lizé, développeur Fullstack & IA à Rennes. Freelance automatisation IA, alternance Mastère IA & Data 2027 à l'EPSI Rennes.">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Caveat:wght@600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script>try { if (localStorage.getItem('lml-theme') === 'dark') document.documentElement.dataset.theme = 'dark'; } catch {}</script>
<style>
:root{
    --board:#f3f2ee; --dot:#d6d3cb; --card:#ffffff; --ink:#1d1d1b; --soft-ink:#45433e; --muted:#77746c; --line:#e7e5df; --chip:#f2f1ed; --chip-h:#e8e6e0;
    --ui:#ffffff; --ui-shadow:0 2px 12px rgba(0,0,0,.08); --zone-a:.05;
    --sel:#0d99ff; --lyam:#7b61ff; --live:#1f8a3a;
    --yellow:#ffe680; --pink:#ffc3d8; --green:#c8f0c4; --blue:#cfe3ff; --violet:#e1d6ff; --orange:#ffd8b8;
    --sans:'Inter',system-ui,sans-serif; --hand:'Caveat',cursive; --mono:'JetBrains Mono',monospace;
}
:root[data-theme="dark"]{
    --board:#1b1b1d; --dot:#34343a; --card:#26262a; --ink:#f1f0ec; --soft-ink:#c9c7c0; --muted:#9a978f; --line:#37373d; --chip:#323238; --chip-h:#3c3c43;
    --ui:#26262a; --ui-shadow:0 2px 16px rgba(0,0,0,.45); --zone-a:.09;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden;overscroll-behavior:none}
body{background:var(--board);color:var(--ink);font:400 14px/1.5 var(--sans);-webkit-font-smoothing:antialiased;touch-action:none;transition:background .3s}
a{color:inherit}
button{color:inherit}

#viewport{position:fixed;inset:0;cursor:grab;
    background-image:radial-gradient(var(--dot) 1.2px,transparent 1.2px);background-size:var(--g,24px) var(--g,24px);background-position:var(--gx,0) var(--gy,0)}
#viewport.panning{cursor:grabbing}
#world{position:absolute;left:0;top:0;transform-origin:0 0;user-select:none}
#world.moving{will-change:transform}
#links{position:absolute;left:0;top:0;overflow:visible;pointer-events:none}
#links path{fill:none;stroke:var(--muted);stroke-width:2;stroke-dasharray:6 6;opacity:.6}
#links text{font:600 22px var(--hand);fill:var(--muted)}

/* Zones (like design-tool sections) */
.zone{position:absolute;border-radius:28px;background:color-mix(in srgb,var(--zc) calc(var(--zone-a) * 100%),transparent);border:1.5px dashed color-mix(in srgb,var(--zc) 35%,transparent);pointer-events:none}
.zone-t{position:absolute;left:0;bottom:100%;transform-origin:0 100%;padding-bottom:10px;white-space:nowrap;font:800 30px/1 var(--sans);letter-spacing:-.03em;color:var(--zc);display:flex;align-items:baseline;gap:10px}

/* Frames */
.frame{position:absolute;background:var(--card);border-radius:12px;box-shadow:0 1px 2px rgba(0,0,0,.06),0 8px 30px rgba(0,0,0,.06);outline:1.5px solid transparent;transition:outline-color .15s,background .3s}
.frame:hover,.frame.active{outline-color:var(--sel)}
.frame .handle{position:absolute;bottom:100%;left:0;margin-bottom:6px;font:500 12px var(--sans);color:var(--muted);cursor:move;white-space:nowrap;display:flex;gap:6px;align-items:center}
.frame:hover .handle,.frame.active .handle{color:var(--sel)}
.frame .corner{position:absolute;width:8px;height:8px;background:var(--card);border:1.5px solid var(--sel);opacity:0;transition:opacity .15s}
.frame:hover .corner,.frame.active .corner{opacity:1}
.c-tl{left:-4px;top:-4px}.c-tr{right:-4px;top:-4px}.c-bl{left:-4px;bottom:-4px}.c-br{right:-4px;bottom:-4px}
.frame .size{position:absolute;top:100%;left:50%;transform:translateX(-50%);margin-top:6px;background:var(--sel);color:#fff;font:500 11px var(--sans);padding:1px 6px;border-radius:3px;opacity:0;white-space:nowrap}
.frame:hover .size,.frame.active .size{opacity:1}
/* Semantic zoom: far away, frames show a big cover title instead of details */
.frame .cover{position:absolute;inset:0;border-radius:12px;background:var(--card);display:flex;flex-direction:column;justify-content:center;padding:40px;opacity:0;pointer-events:none;transition:opacity .25s}
.frame .cover b{font:800 64px/1 var(--sans);letter-spacing:-.04em}
.frame .cover span{font:500 26px/1.3 var(--sans);color:var(--muted);margin-top:14px}
#world.far .frame .cover{opacity:1}
#world.far .frame .handle{opacity:0}
#world.far .sticky b{font-size:30px}

.pad{padding:28px 30px}
h1{font:800 64px/.95 var(--sans);letter-spacing:-.045em}
h2{font:700 26px/1.1 var(--sans);letter-spacing:-.03em;margin-bottom:14px}
.lbl{font:500 11px var(--mono);text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-bottom:8px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font:500 12.5px var(--sans);padding:4px 10px;border-radius:6px;background:var(--chip)}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:20px}
.btn{display:inline-flex;align-items:center;gap:8px;padding:9px 14px;border-radius:8px;background:var(--chip);text-decoration:none;font:600 13.5px var(--sans);cursor:pointer;border:0}
.btn:hover{background:var(--chip-h)}
.btn.p{background:var(--ink);color:var(--card)}
.kv{display:grid;grid-template-columns:110px 1fr;gap:8px 14px;font-size:14px}
.kv dt{color:var(--muted)}
.hit{animation:hit 2.2s ease}
@keyframes hit{0%,60%{box-shadow:0 0 0 3px var(--sel);background:color-mix(in srgb,var(--sel) 22%,var(--chip))}}

.hero .status{display:inline-flex;align-items:center;gap:8px;background:var(--green);color:#1d1d1b;border-radius:999px;padding:4px 12px;font:600 12.5px var(--sans);margin-bottom:22px}
.hero .status::before{content:'';width:8px;height:8px;border-radius:50%;background:var(--live);animation:pulse 2s infinite}
@keyframes pulse{50%{opacity:.3}}
.hero p{font-size:17px;color:var(--soft-ink);margin-top:14px;max-width:46ch}
.hero .facts{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:22px}
.hero .facts div{background:var(--chip);border-radius:10px;padding:12px 14px}
.hero .facts b{display:block;font:800 26px/1 var(--sans);letter-spacing:-.03em}
.hero .facts span{font-size:12.5px;color:var(--muted)}

/* Project windows */
.win{overflow:hidden}
.win .bar{display:flex;align-items:center;gap:6px;padding:9px 12px;background:var(--chip);border-bottom:1px solid var(--line);font:500 12px var(--mono);color:var(--muted)}
.win .bar i{width:10px;height:10px;border-radius:50%;background:#ff5f57}.win .bar i:nth-child(2){background:#febc2e}.win .bar i:nth-child(3){background:#28c840}
.win .bar span{margin-left:8px;flex:1}
.win .bar button{font:600 11.5px var(--sans);border:1px solid var(--line);background:var(--card);border-radius:6px;padding:3px 9px;cursor:pointer}
.win .bar button:hover{border-color:var(--sel);color:var(--sel)}
.win .bar button.on{background:var(--live);border-color:var(--live);color:#fff}
.stage{position:relative;background:var(--chip)}
.shots{display:grid;grid-template-columns:2fr 1fr 1fr;gap:6px;padding:6px}
.shots img{width:100%;height:100%;aspect-ratio:16/10;object-fit:cover;object-position:top;border-radius:5px;display:block;cursor:zoom-in}
.shots img:first-child{grid-row:span 2}
.stage iframe{display:block;width:100%;height:420px;border:0;background:#fff}
.win .info{padding:20px 22px 22px}
.win h3{font:800 30px/1 var(--sans);letter-spacing:-.03em;display:flex;justify-content:space-between;align-items:center;gap:10px}
.win h3 a{flex:none;display:inline-flex;align-items:center;gap:6px;font:600 13px/1 var(--sans);letter-spacing:0;padding:9px 13px;border-radius:8px;background:var(--ink);color:var(--card);text-decoration:none;transition:opacity .15s}
.win h3 a:hover{opacity:.85}
.badge{display:inline-block;font:600 11px var(--sans);padding:2px 8px;border-radius:5px;background:var(--violet);color:#1d1d1b;margin-right:4px}
.win p{color:var(--soft-ink);margin:10px 0}
.win ul{padding-left:18px;color:var(--soft-ink);margin-bottom:12px;font-size:13.5px}

.svc{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.svc > div{background:var(--chip);border-radius:12px;padding:18px}
.svc h3{font:700 19px var(--sans);letter-spacing:-.02em;margin-bottom:6px}
.svc p{color:var(--soft-ink);font-size:13.5px;margin-bottom:12px}
.svc .chip{background:var(--card)}

.sticky{position:absolute;width:210px;min-height:190px;padding:18px 18px 20px;color:#1d1d1b;box-shadow:0 2px 0 rgba(0,0,0,.04),0 10px 20px rgba(0,0,0,.1);border-radius:2px;transition:transform .2s}
.sticky b{display:block;font:700 22px/1.1 var(--sans);letter-spacing:-.02em;margin-bottom:8px}
.sticky span{font-size:14px;color:#3d3b37}

.tl{position:relative;padding-left:22px}
.tl::before{content:'';position:absolute;left:6px;top:6px;bottom:6px;width:2px;background:var(--line)}
.tl > div{position:relative;padding-bottom:18px}
.tl > div::before{content:'';position:absolute;left:-22px;top:5px;width:14px;height:14px;border-radius:50%;background:var(--card);border:2px solid var(--ink)}
.tl > div.now::before{background:var(--live);border-color:var(--live)}
.tl > div.next::before{border-style:dashed}
.tl .when{font:500 12px var(--mono);color:var(--muted)}
.tl b{display:block;font:700 16px/1.25 var(--sans);margin:2px 0}
.tl small{display:block;color:var(--muted);font-size:13px}
.tl ul{padding-left:16px;font-size:13.5px;color:var(--soft-ink);margin-top:4px}
.certs{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.cert{display:flex;flex-direction:column;padding:0;border-radius:10px;border:1px solid var(--line);background:var(--card);cursor:zoom-in;text-align:left;font:inherit;overflow:hidden;transition:transform .2s,box-shadow .2s,border-color .2s}
.cert:hover{transform:translateY(-3px);border-color:var(--sel);box-shadow:0 10px 24px rgba(0,0,0,.12)}
.cert .meta{display:flex;align-items:center;gap:10px;padding:10px 12px}
.cert .meta .ft{flex:none;width:34px;height:40px;border-radius:4px 10px 4px 4px;background:var(--chip);display:grid;place-items:center;font:600 9.5px var(--mono);color:var(--muted);transition:background .2s,color .2s}
.cert:hover .meta .ft{background:color-mix(in srgb,var(--sel) 14%,var(--chip));color:var(--sel)}
.cert .meta div{flex:1;min-width:0}
.cert .meta b{display:block;font:600 13.5px/1.25 var(--sans)}
.cert .meta span{font:500 11px var(--mono);color:var(--muted)}
.cert .meta i{flex:none;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--chip);font-style:normal;font-size:14px;transition:background .2s,color .2s}
.cert:hover .meta i{background:var(--sel);color:#fff}
.skills .cat{margin-bottom:26px}
.skills .cat:last-child{margin-bottom:0}
.skills .cat h2{font-size:17px;margin-bottom:10px}
.lang{display:grid;grid-template-columns:100px 1fr 46px;gap:12px;align-items:center;margin:10px 0;font-weight:600}
.lang .m{height:8px;background:var(--chip);border-radius:4px;overflow:hidden}
.lang .m i{display:block;height:100%;background:var(--ink)}
.note{font:600 26px/1.1 var(--hand);color:var(--muted);position:absolute;white-space:nowrap;pointer-events:none}

/* Lyam's cursor + cursor chat */
.lyam-cursor{position:absolute;left:0;top:0;pointer-events:none;transition:transform 1.1s cubic-bezier(.65,0,.35,1);z-index:5}
.lyam-cursor svg{display:block}
.lyam-cursor .name{position:absolute;left:16px;top:18px;background:var(--lyam);color:#fff;font:600 12px var(--sans);padding:3px 8px;border-radius:0 8px 8px 8px;white-space:nowrap}
.lyam-cursor .chat{position:absolute;left:16px;top:44px;background:var(--lyam);color:#fff;font:500 15px/1.35 var(--sans);padding:8px 12px;border-radius:0 12px 12px 12px;width:max-content;max-width:340px;opacity:0;transform:translateY(-4px);transition:opacity .3s,transform .3s}
.lyam-cursor .chat.on{opacity:1;transform:none}

/* UI chrome */
.ui{position:fixed;z-index:10}
.panel-ui{background:var(--ui);border-radius:10px;box-shadow:var(--ui-shadow)}
.top-left{top:14px;left:14px;display:flex;gap:4px;align-items:center;padding:5px 5px 5px 12px}
.top-left b{font:700 14px var(--sans);margin-right:6px;white-space:nowrap}
.icon-btn{height:30px;min-width:30px;padding:0 8px;border:0;background:none;border-radius:7px;cursor:pointer;font:500 13px var(--sans);display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.icon-btn:hover{background:var(--chip)}
.icon-btn kbd{font:11px var(--mono);color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:0 4px}
.nav{top:14px;left:50%;transform:translateX(-50%);display:flex;gap:2px;padding:4px;max-width:calc(100vw - 28px);overflow-x:auto;scrollbar-width:none}
.nav button{font:500 13px var(--sans);border:0;background:none;padding:6px 11px;border-radius:7px;cursor:pointer;white-space:nowrap;color:var(--muted)}
.nav button:hover{background:var(--chip);color:var(--ink)}
.nav button.on{background:var(--ink);color:var(--card)}
.top-right{top:14px;right:14px;display:flex;gap:2px;padding:4px}
.tools{bottom:64px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:2px;padding:4px}
.tools .z{font:500 12.5px var(--mono);width:52px;text-align:center}
.tools .sep{width:1px;height:20px;background:var(--line);margin:0 4px}
.minimap{bottom:64px;right:14px;width:210px;height:140px;cursor:pointer;overflow:hidden}

/* Loading screen (until fonts + thumbnails are ready) */
.loader{position:fixed;inset:0;z-index:60;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;background:var(--board);transition:opacity .45s}
.loader.gone{opacity:0;pointer-events:none}
.loader b{font:800 28px/1 var(--sans);letter-spacing:-.03em}
.loader .lbar{width:min(260px,70vw);height:4px;border-radius:2px;background:var(--chip);overflow:hidden}
.loader .lbar i{display:block;height:100%;width:0;background:var(--lyam);transition:width .25s}
.loader span{font:500 12px var(--mono);color:var(--muted)}


/* Search palette */
.palette{inset:0;z-index:40;display:none;justify-content:center;align-items:flex-start;padding-top:12vh;background:rgba(0,0,0,.18)}
.palette.on{display:flex}
.palette .box{width:min(600px,92vw);overflow:hidden}
.palette input{width:100%;border:0;border-bottom:1px solid var(--line);padding:14px 16px;font:15px var(--sans);outline:0;background:none;color:var(--ink)}
.palette .res{max-height:50vh;overflow-y:auto;padding:4px}
.palette .res button{display:flex;gap:10px;align-items:center;width:100%;padding:8px 12px;background:none;border:0;font:14px var(--sans);cursor:pointer;text-align:left;border-radius:7px}
.palette .res button span{color:var(--muted);margin-left:auto;font-size:12px;white-space:nowrap}
.palette .res button.on{background:color-mix(in srgb,var(--sel) 14%,transparent)}
.palette .res .empty{padding:14px;color:var(--muted)}

/* Reader (list mode) */
.reader{inset:0;z-index:30;background:var(--board);overflow-y:auto;display:none;touch-action:auto}
.reader.on{display:block}
.reader .in{max-width:760px;margin:0 auto;padding:80px 16px 120px;display:flex;flex-direction:column;gap:22px}
.reader .frame,.reader .sticky{position:static;width:auto !important;transform:none !important}
.reader .frame .handle{position:static;margin:0 0 8px;color:var(--sel)}
.reader .softs{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.reader .sticky{min-height:0}
.reader .zone-h{font:800 34px var(--sans);letter-spacing:-.03em;margin-top:24px}
.reader-close{top:14px;right:14px;z-index:31}

.lightbox{position:fixed;inset:0;background:rgba(0,0,0,.8);display:none;align-items:center;justify-content:center;z-index:50;padding:24px}
.lightbox.on{display:flex}
.lightbox img{max-width:100%;max-height:90vh;border-radius:8px}

@media (max-width:860px){
    .minimap,.top-left .lbl-full,.icon-btn kbd{display:none}
    .nav{top:58px}
    .tools{bottom:60px}
}
</style>
</head>
<body>
<div id="viewport"><div id="world"><svg id="links" width="1" height="1"></svg></div></div>

<div class="ui panel-ui top-left"><b>Lyam Mafray-Lizé</b>
    <button class="icon-btn" id="search-btn" title="Rechercher (Ctrl+K)">⌕ <span class="lbl-full">Rechercher</span> <kbd>Ctrl K</kbd></button>
</div>
<nav class="ui panel-ui nav" id="nav"></nav>
<div class="ui panel-ui top-right">
    <button class="icon-btn" id="list-btn" title="Lire en liste">☰ <span class="lbl-full">Liste</span></button>
    <button class="icon-btn" id="theme-btn" title="Thème clair / sombre">◐</button>
</div>
<div class="ui panel-ui tools">
    <button class="icon-btn" id="zout" title="Dézoomer">−</button><span class="z" id="zlabel">100%</span><button class="icon-btn" id="zin" title="Zoomer">+</button>
    <button class="icon-btn" id="fit" title="Tout voir (0)">⤢</button>
</div>
<canvas class="ui panel-ui minimap" id="mini" width="420" height="280"></canvas>

<div class="loader" id="loader" role="status" aria-live="polite"><b>Lyam Mafray-Lizé</b><div class="lbar"><i id="load-bar"></i></div><span>Chargement du tableau…</span></div>

<div class="ui palette" id="palette"><div class="box panel-ui"><input id="pal-in" placeholder="Chercher une techno, un projet, une école… (ex. Docker, Kaggle)" autocomplete="off"><div class="res" id="pal-res"></div></div></div>
<div class="ui reader" id="reader"><div class="in" id="reader-in"></div></div>
<button class="ui panel-ui icon-btn reader-close" id="reader-close" style="display:none">⤢ Revenir au tableau</button>
<div class="lightbox" id="lb"><img alt=""></div>

<script type="module">
import { PROFILE, SEARCH, EXPERIENCES, EDUCATION, SKILLS, SOFT_SKILLS, LANGUAGES, CERTIFICATIONS, PROJECTS, SERVICES, fullName, monthsUntilStart, monthsOfExperience } from '/data.js';
import '/lab/cert-viewer.js';

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const chips = a => `<div class="chips">${a.map(t => `<span class="chip">${esc(t)}</span>`).join('')}</div>`;
// Canvas shows light JPG thumbnails (public/thumbs/); the lightbox and viewer still open the full-size files.
const thumb = s => s.endsWith(".png") ? "/thumbs" + s.replace(/.png$/, ".jpg") : s;
const shots = p => `<div class="shots">${[p.thumbnail, ...p.images.slice(0, 4)].map(s => `<img src="${thumb(s)}" alt="" data-zoom="${s}" decoding="async">`).join("")}</div>`;
const cur = EDUCATION.find(e => e.current);
const yrs = Math.floor(monthsOfExperience() / 12);
const nTech = SKILLS.reduce((n, c) => n + c.items.length, 0);
const STICKY = ['var(--yellow)', 'var(--pink)', 'var(--green)', 'var(--blue)', 'var(--violet)', 'var(--orange)'];

// ── Zones & frames (world coordinates, px at 100%) ───────────
const ZONES = [
    { id: 'profil', title: 'Profil', color: '#0d99ff' },
    { id: 'projets', title: 'Projets & freelance', color: '#7b61ff' },
    { id: 'competences', title: 'Compétences', color: '#14ae5c' },
    { id: 'parcours', title: 'Parcours', color: '#f24e1e' },
    { id: 'contact', title: 'Contact', color: '#ffa629' },
];
const FRAMES = [
    { id: 'hero', zone: 'profil', label: 'Intro', cover: [fullName, PROFILE.title], x: 0, y: 0, w: 680, cls: 'hero pad', html: `
        <span class="status">Recherche une alternance · ${esc(SEARCH.start)}</span>
        <h1>${esc(PROFILE.firstName)}<br>${esc(PROFILE.lastName)}</h1>
        <p>${esc(PROFILE.pitch.main)}</p>
        <div class="facts"><div><b>${yrs} ans+</b><span>d'expérience pro</span></div><div><b>${PROJECTS.length}</b><span>produits en ligne</span></div><div><b>${CERTIFICATIONS.length}</b><span>certifications</span></div></div>
        <div class="btns"><a class="btn p" href="mailto:${PROFILE.email}">✉ Me contacter</a><a class="btn" href="${PROFILE.linkedin}" target="_blank" rel="noopener">LinkedIn ↗</a>
        <a class="btn" href="${PROFILE.github}" target="_blank" rel="noopener">GitHub ↗</a>${PROFILE.cv ? `<a class="btn" href="${PROFILE.cv}" download>CV ↓</a>` : ''}</div>` },
    { id: 'recherche', zone: 'profil', label: 'Recherche', cover: ['Alternance', `${SEARCH.program} · ${SEARCH.start}`], x: 780, y: 0, w: 480, cls: 'pad', html: `

const mini = $('mini'), mctx = mini.getContext('2d');

    const ox = pad + (W - pad * 2 - mb.w * s) / 2 - mb.x * s, oy = pad + (H - pad * 2 - mb.h * s) / 2 - mb.y * s;

const norm = s => s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
let palList = [], palIdx = 0;
function palRender() {
    const q = norm($('pal-in').value.trim());
    const seen = new Set();
    palList = (q ? INDEX.filter(it => norm(it.text).includes(q)) : INDEX.filter(it => it.kind === 'Section'))
        .filter(it => { const k = it.text + it.fid; if (seen.has(k)) return false; seen.add(k); return true; }).slice(0, 40);
    palIdx = Math.min(palIdx, Math.max(0, palList.length - 1));
    $('pal-res').innerHTML = palList.length ? palList.map((it, i) => `<button class="${i === palIdx ? 'on' : ''}" data-i="${i}">${esc(it.text)}<span>${esc(it.kind)}</span></button>`).join('')
        : `<div class="empty">Aucun résultat pour « ${esc($('pal-in').value)} ».</div>`;
}

function palGo(it) {

    setTimeout(() => same.forEach(x => { x.el.classList.remove('hit'); void x.el.offsetWidth; x.el.classList.add('hit'); }), 700);

    else if (e.key === 'Enter' && palList[palIdx]) palGo(palList[palIdx]);

    $('reader').classList.add('on'); $('reader-close').style.display = '';
}
function closeReader() { $('reader').classList.remove('on'); $('reader-close').style.display = 'none'; }
$('list-btn').onclick = openReader;
$('reader-close').onclick = closeReader;
$('reader').addEventListener('click', e => { const z = e.target.closest('[data-zoom]'); if (z) { $('lb').querySelector('img').src = z.dataset.zoom; $('lb').classList.add('on'); } });

// ── Live preview inside project windows ───────────────────────
document.addEventListener('click', e => {
    const b = e.target.closest('[data-live]'); if (!b) return;
    const p = PROJECTS.find(p => p.id === b.dataset.live), stage = b.closest('.win').querySelector('.stage');
    const on = !b.classList.contains('on');
    b.classList.toggle('on', on); b.textContent = on ? '■ Captures' : '▶ Aperçu live';
    stage.innerHTML = on ? `<iframe src="${p.url}" title="${esc(p.name)} - aperçu live" loading="lazy"></iframe>`
        : `${shots(p)}`;
    layout();
});

// ── Nav, theme, keys ─────────────────────────────────────────
const NAV = [['hero', 'Intro'], ['recherche', 'Recherche'], ['zone:projets', 'Projets'], ['skills', 'Compétences'], ['soft', 'Soft skills'], ['parcours', 'Parcours'], ['certs', 'Certifs'], ['langues', 'Langues'], ['contact', 'Contact']];
$('nav').innerHTML = NAV.map(([id, l]) => `<button data-go="${id}">${l}</button>`).join('');
$('nav').addEventListener('click', e => { const b = e.target.closest('[data-go]'); if (b) focusFrame(b.dataset.go); });
$('zin').onclick = () => { userMoved(); zoomAt(1.25, innerWidth / 2, innerHeight / 2); };
$('zout').onclick = () => { userMoved(); zoomAt(.8, innerWidth / 2, innerHeight / 2); };
$('fit').onclick = () => { userMoved(); frameEls.forEach(f => f.classList.remove('active')); flyTo(bounds(), { pad: 40 }); };
try { if (localStorage.getItem('lml-theme') === 'dark') document.documentElement.dataset.theme = 'dark'; } catch {}
$('theme-btn').onclick = () => {
    const dark = document.documentElement.dataset.theme !== 'dark';
    document.documentElement.dataset.theme = dark ? 'dark' : '';
    try { localStorage.setItem('lml-theme', dark ? 'dark' : 'light'); } catch {}
    cacheGeom(); apply();
};
addEventListener('keydown', e => {
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); palOpen(); return; }
    if (e.target.tagName === 'INPUT') return;
    if (e.key === '/') { e.preventDefault(); palOpen(); }
    else if (e.key === 'Escape' && $('reader').classList.contains('on')) closeReader();
    else if (e.key === '+' || e.key === '=') $('zin').click();
    else if (e.key === '-') $('zout').click();
    else if (e.key === '0') $('fit').click();
    else if (/^[1-9]$/.test(e.key) && NAV[+e.key - 1]) focusFrame(NAV[+e.key - 1][0]);
});
const lb = $('lb');
world.addEventListener('click', e => { const z = e.target.closest('[data-zoom]'); if (z && moved < 6) { lb.querySelector('img').src = z.dataset.zoom; lb.classList.add('on'); } });
lb.addEventListener('click', () => lb.classList.remove('on'));
addEventListener('resize', apply);

// Intro: the whole board, far zoom (covers + zone titles), Lyam's cursor waiting on the hero.
const all = bounds(), z0 = Math.min((innerWidth - 60) / all.w, (innerHeight - 260) / all.h);
cam = { z: z0, x: innerWidth / 2 - (all.x + all.w / 2) * z0, y: (innerHeight - 140) / 2 - (all.y + all.h / 2) * z0 + 20 };
apply();
moveCursor(...cursorRest());
const deep = location.hash.slice(1);
const first = deep && (byId[deep] || deep === 'soft') ? deep : ZONES.some(z => z.id === deep) ? 'zone:' + deep : 'hero';

// Loading screen: wait for fonts and board images, capped so a slow network never blocks the page.
const pending = [...world.querySelectorAll('img')].filter(i => !i.complete);
const total = pending.length + 1;
let done = 0;
const tick = () => { done++; $('load-bar').style.width = Math.round(done / total * 100) + '%'; };
const ready = Promise.all([document.fonts.ready.then(tick), ...pending.map(i => new Promise(r => { i.addEventListener('load', r, { once: true }); i.addEventListener('error', r, { once: true }); }).then(tick))]);
Promise.race([ready, new Promise(r => setTimeout(r, 8000))]).then(() => {
    layout(); apply();
    $('loader').classList.add('gone');
    setTimeout(() => $('loader').remove(), 500);
    setTimeout(() => focusFrame(first, { dur: 1400 }), 700);
});
</script>
</body>
</html>
