<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projets — Lyam Mafray-Lizé</title>
    <meta name="description" content="Projets de Lyam Mafray-Lizé, développeur Fullstack & IA.">
    <link rel="icon" type="image/svg+xml" href="./favicon.svg">
    <link rel="stylesheet" href="./style.css">
    <link rel="stylesheet" href="./projects.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&family=Outfit:wght@400;700&display=swap"
        rel="stylesheet">
</head>

<body class="bg-dark text-light">
    <header class="fixed-nav">
        <nav class="container">
            <a href="./index.html" class="logo">Lyam<span>.</span></a>
            <ul class="nav-links">
                <li><a href="./index.html#hero">Accueil</a></li>
                <li><a href="./index.html#skills">Compétences</a></li>
                <li><a href="./index.html#experiences">Expériences</a></li>
                <li><a href="./index.html#formations">Formation</a></li>
                <li><a href="./index.html#contact">Contact</a></li>
                <li class="nav-projects-item"><a href="/projets" class="nav-projects-btn nav-projects-active">Projets</a></li>
            </ul>
            <div class="menu-toggle"><span></span></div>
        </nav>
    </header>

    <main>
        <section class="proj-page-hero">
            <div class="grid-pattern"></div>
            <div class="container">
                <span class="proj-page-label">DÉVELOPPEMENT & IA</span>
                <h1 class="proj-page-title">Projets</h1>
                <p class="proj-page-sub">Applications, SaaS et expérimentations.</p>
            </div>
        </section>

        <section class="proj-page-list py-20">
            <div class="container">
                <div id="projects-grid" class="proj-grid"></div>
            </div>
        </section>
    </main>

    <!-- Project Detail Modal -->
    <div id="proj-modal" class="proj-modal">
        <div class="proj-modal-overlay" id="proj-modal-overlay"></div>
        <div class="proj-modal-inner">
            <div class="proj-iframe-pane">
                <iframe id="proj-iframe" src="" title="Aperçu du projet" frameborder="0"></iframe>
                <div class="iframe-loading" id="iframe-loading">
                    <div class="iframe-spinner"></div>
                </div>
            </div>
            <div class="proj-details-pane">
                <div class="proj-details-header">
                    <div class="proj-details-title-row">
                        <div>
                            <div class="proj-details-badges" id="detail-badge"></div>
                            <h2 class="proj-details-name" id="detail-name"></h2>
                        </div>
                        <button class="proj-modal-close-btn" id="proj-modal-close">&times;</button>
                    </div>
                    <a class="proj-details-ext-link" id="detail-ext-link" href="#" target="_blank"
                        rel="noopener noreferrer">↗ Ouvrir dans un nouvel onglet</a>
                </div>
                <div class="proj-details-body">
                    <p class="proj-details-desc" id="detail-desc"></p>
                    <div class="proj-details-tags-block">
                        <span class="proj-section-label">Stack</span>
                        <div class="proj-details-tags" id="detail-tags"></div>
                    </div>
                    <div class="proj-gallery-block" id="gallery-block">
                        <span class="proj-section-label">Captures d'écran</span>
                        <div class="proj-gallery-container">
                            <button class="gallery-nav-btn" id="gallery-prev">&#8249;</button>
                            <div class="proj-gallery-track-wrapper">
                                <div class="proj-gallery-track" id="gallery-track"></div>
                            </div>
                            <button class="gallery-nav-btn" id="gallery-next">&#8250;</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Image Lightbox -->
    <div id="img-lightbox" class="img-lightbox">
        <div class="lightbox-overlay" id="lightbox-overlay"></div>
        <button class="lightbox-nav lightbox-prev" id="lightbox-prev">&#8249;</button>
        <img id="lightbox-img" src="" alt="Capture d'écran">
        <button class="lightbox-nav lightbox-next" id="lightbox-next">&#8250;</button>
        <button class="lightbox-close" id="lightbox-close">&times;</button>
    </div>

    <script type="module" src="./projects.js"></script>
</body>

</html>
